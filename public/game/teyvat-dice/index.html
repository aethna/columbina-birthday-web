<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<title>提瓦特战力党</title>
<style>
:root{
  /* 瀛椾綋鏍堬細Google Fonts(鎬濇簮 web 鐗? -> 鏈湴鎬濇簮 -> 绯荤粺瀛椾綋 */
  --font-ui:"Noto Sans SC","Source Han Sans SC","Source Han Sans CN","思源黑体","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-title:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","思源宋体","Songti SC","SimSun",serif;
  --deep:#0b1020; --panel:#1b2237; --panel2:#232c45; --line:#39435f;
  --gold:#f5c74a; --gold2:#ffe08a; --cyan:#5fd0f0; --purple:#a97cf0;
  --txt:#eef1f8; --dim:#8e98b5; --red:#f2604a; --green:#4fd08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#05070e}
body{color:var(--txt);font-family:var(--font-ui)}
button{font-family:inherit}

/* =====================================================================
   16:9 全屏舞台：等比缩放到最大化后居中。非 16:9 的窗口由 #bleed 那层
   「当前画面的模糊放大版」铺满，不是黑边。
   所有画面与元素都按「舞台的百分比」定位，所以背景图与 CSS 覆盖层永远对齐；
   凡是要用宽高比的地方（攻击动画位移 / 光束角度）一律实测，不写死 16/9。
   竖屏由 #lgate 挡住，因此实际只会在横屏出现 —— 横屏下等比缩放是「高度受限」，
   舞台高度被撑满，字号与骰子的像素大小和铺满时完全一样，只是两侧多出模糊延伸。
   ===================================================================== */
#app{container-type:size;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#05070e}

/* --- 全屏按钮：舞台右上角（棋盘页这块区域本来是空的）。
       不支持元素全屏的浏览器（iOS Safari）自动不显示。 --- */
.fsBtn{position:absolute;z-index:60;right:1.6%;top:1.6%;width:5cqh;height:5cqh;display:none;
  place-items:center;padding:0;cursor:pointer;border-radius:50%;
  border:1px solid rgba(255,232,150,.42);background:rgba(9,15,32,.58);color:#ffe08a;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:.18s}
.fsBtn.on{display:grid}
.fsBtn:hover{border-color:var(--gold);background:rgba(22,32,60,.86)}
.fsBtn svg{width:2.7cqh;height:2.7cqh;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
/* 图标跟着状态换：⤢ 进全屏 / ⤡ 退全屏，点一下切换一次 */
.fsBtn .fsExit{display:none}
.fsBtn.isFs .fsEnter{display:none}
.fsBtn.isFs .fsExit{display:block}
/* 图鉴/剧情页右侧的关卡标签是 margin-left:auto 贴右的，给它让出按钮的位置，
   否则会被全屏按钮压住（实测：不留位置时 #stageTag 与按钮相交）。 */
.topBar .stageTag{margin-right:8.4cqh}

/* --- 竖屏挡层：手机竖屏时盖住整屏。放在 #app 之外，所以用 vh/vw 而非 cqh。 --- */
#lgate{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  padding:6vh 7vw;text-align:center;
  background:radial-gradient(circle at 50% 40%,#1c2a55 0,#0a1024 55%,#04060d 100%)}
#lgate.on{display:flex}
#lgate .lgBox{display:flex;flex-direction:column;align-items:center;gap:2.4vh;max-width:86vw}
#lgate svg{width:15vh;height:15vh;fill:none;stroke:var(--gold);stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;animation:lgTilt 3.2s ease-in-out infinite}
#lgate svg rect{fill:rgba(255,232,150,.08)}
#lgate svg .lgTip{fill:var(--gold);stroke:none}
@keyframes lgTilt{0%,22%{transform:rotate(0)}46%,72%{transform:rotate(-90deg)}96%,100%{transform:rotate(0)}}
#lgate p{margin:0;font-size:clamp(15px,4.4vw,21px);line-height:1.9;letter-spacing:.1em;color:var(--txt)}
#lgate p b{color:var(--gold2)}
#lgate .lgFs{display:none;padding:1.4vh 6vw;border:0;border-radius:1vh;cursor:pointer;
  font-family:var(--font-title);font-size:clamp(15px,4vw,19px);font-weight:900;letter-spacing:.14em;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241c00;
  box-shadow:0 .5vh 0 #8a6508,0 0 4vh rgba(245,199,74,.45)}
#lgate .lgFs.on{display:inline-block}
@media(prefers-reduced-motion:reduce){#lgate svg{animation:none}}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
#s-select{overflow-y:auto;padding:1.6% 2%}
.stage{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}

/* ---------- 通用 ---------- */
.die{position:relative;display:grid;place-items:center;font-weight:800;color:#fff;
  flex:0 0 auto;text-shadow:0 1px 2px rgba(0,0,0,.55);user-select:none;font-variant-numeric:tabular-nums;
  transition:transform .14s,filter .14s}
.sz-s{width:3.2cqh;height:2.0cqh;font-size:1.5cqh}
.sz-l{width:9.2cqh;height:5.75cqh;font-size:3.1cqh}
.die.f4{clip-path:polygon(50% 3%,100% 97%,0 97%);background:linear-gradient(160deg,#8fe0f5,#2f9fc4);align-items:end;padding-bottom:.3cqh}
.die.f6{border-radius:22%;background:linear-gradient(160deg,#bb95f5,#7546cf)}
.die.f8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(160deg,#ffdf8a,#c99a20)}
.die.f10{clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);background:linear-gradient(160deg,#f7a6c2,#c1547f);align-items:end;padding-bottom:.4cqh}
.die.sel{filter:drop-shadow(0 0 .7cqh var(--gold)) brightness(1.12);transform:translateY(-.4cqh)}
.die.off{opacity:.3;filter:grayscale(.8)}
.die.click{cursor:pointer}
.die.click:hover{transform:translateY(-.25cqh)}
@keyframes rerollPick{
  0%,100%{filter:drop-shadow(0 0 .55cqh var(--cyan)) brightness(1.12);transform:translateY(-.25cqh) scale(1.02)}
  50%{filter:drop-shadow(0 0 1.35cqh var(--cyan)) brightness(1.42);transform:translateY(-.65cqh) scale(1.08)}
}
.die.reroll{opacity:1;animation:rerollPick 1.05s ease-in-out infinite}
.diceRow{display:flex;gap:.7cqh;flex-wrap:wrap;align-items:center;justify-content:center}

/* ---------- 选卡 ---------- */
h1{font-family:var(--font-title);font-size:2.6cqh;margin:0 0 .2cqh;text-align:center;color:var(--gold2);letter-spacing:.18em;font-weight:600}
.sub{text-align:center;color:var(--dim);font-size:1.15cqh;letter-spacing:.26em;margin-bottom:1.2cqh}
.bar{display:flex;gap:.7cqh;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:1cqh}
.bar .label{color:var(--dim);font-size:1.4cqh}
.opt{padding:.6cqh 1.4cqh;border:1px solid var(--line);border-radius:.6cqh;background:var(--panel);
  color:var(--dim);cursor:pointer;font-size:1.4cqh;transition:.15s}
.opt:hover{border-color:var(--gold);color:var(--txt)}
.opt.on{background:var(--gold);border-color:var(--gold);color:#241c00;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9cqh;margin-top:1cqh}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:1cqh;padding:1cqh 1.1cqh;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .role{position:absolute;top:0;right:0;font-size:1cqh;padding:.2cqh .8cqh;border-bottom-left-radius:.8cqh;background:var(--line);color:var(--dim)}
.card .nm{font-size:1.9cqh;color:var(--gold2);font-weight:600;margin-bottom:.5cqh}
.card .row{display:flex;align-items:center;gap:.5cqh;margin:.4cqh 0;font-size:1.25cqh;color:var(--dim)}
.card .row .k{width:4.4cqh;flex:0 0 auto}
.card .sk{font-size:1.25cqh;color:var(--cyan);margin-top:.6cqh}
.hint{font-size:1.3cqh;color:var(--dim);text-align:center;margin-top:1cqh;line-height:1.6}

/* ---------- 对局开始（背景即原作画面） ---------- */
.startWrap{position:absolute;inset:0;background:#f5c74a center/100% 100% no-repeat}
.startWrap>div:first-child{display:none}
.startWrap .vs{position:absolute;left:0;right:0;bottom:3.5%;margin:0;gap:0;justify-content:center;display:flex}
.startWrap .vsSide{width:24%;text-align:center;color:#2a2000}
.startWrap .vsSide .pav{width:6.4cqh;height:6.4cqh;font-size:2.6cqh;margin:0 auto .6cqh;border-radius:50%;
  display:grid;place-items:center;background:rgba(42,32,0,.85);color:#ffd95e;border:3px solid rgba(42,32,0,.95)}
.startWrap .vsSide .pn{font-size:1.9cqh;font-weight:800}
.startWrap .vsSide .pr{font-size:1.2cqh;opacity:.72}
.startWrap .vsMid{display:none}
/* 「对局开始」四字：原图上的烤字已删，这里用开源字体(Noto Serif SC)补上 */
#s-start .bigBtn{position:absolute;left:39%;top:54.5%;width:22%;height:10%;
  background:transparent;box-shadow:none;padding:0;border-radius:1cqh;
  transition:.15s;border:none;cursor:pointer;
  font-family:var(--font-title);font-size:5.2cqh;font-weight:900;letter-spacing:.18em;
  color:#ffe9a8;text-indent:.18em;
  text-shadow:0 .35cqh .6cqh rgba(60,20,0,.75),0 0 2.2cqh rgba(255,190,60,.85),
              0 0 5cqh rgba(255,150,20,.55)}
#s-start .bigBtn:hover{background:rgba(255,255,255,.26);box-shadow:0 0 0 2px rgba(42,32,0,.35)}

/* ---------- 投币 ---------- */
.coinStage{position:absolute;inset:0;background:#0b1020 center/100% 100% no-repeat}
.coinStage .coinGrid{display:none}
.coinStage .coinTitle{position:absolute;left:50%;top:13.0%;transform:translateX(-50%);
  width:46%;text-align:center;font-family:var(--font-title);font-size:5cqh;font-weight:900;
  letter-spacing:.34em;text-indent:.34em;color:#e4eeff;
  text-shadow:0 0 2.6cqh rgba(96,184,255,.9),0 0 5.4cqh rgba(60,132,255,.6),
              0 .35cqh .7cqh rgba(0,0,0,.7)}
/* 自绘硬币正好盖住图上被扣空的硬币槽（中心 50.3%,44.7% 直径 16.9%） */
.coinStage .coin{position:absolute;left:50.3%;top:44.7%;width:17.6%;aspect-ratio:1;
  transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#ffe9a3,#f0bb2e 48%,#b8860b 100%);
  border:.55cqh solid #f5c74a;box-shadow:0 0 0 .3cqh #8a6508,0 1cqh 2.4cqh rgba(0,0,0,.55)}
.coinStage .coin.back{background:radial-gradient(circle at 34% 28%,#c9d6e8,#7e8ea8 48%,#4c5771 100%);
  border-color:#aab8cc;box-shadow:0 0 0 .3cqh #39435f,0 1cqh 2.4cqh rgba(0,0,0,.55)}
.coinStage .coin .face{font-size:4.6cqh;line-height:1;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.coinStage .coin.spin{animation:spinT 1.25s cubic-bezier(.3,.7,.35,1)}
@keyframes spinT{
  0%{transform:translate(-50%,-50%) rotateY(0) scale(.5)}
  50%{transform:translate(-50%,-50%) rotateY(1080deg) scale(1.14)}
  100%{transform:translate(-50%,-50%) rotateY(2160deg) scale(1)}}
.coinStage .sideTxt{font-family:var(--font-title);position:absolute;left:50%;top:68.5%;transform:translateX(-50%);margin:0;
  font-size:3.9cqh;font-weight:900;letter-spacing:.2em;padding:.2cqh 2.6cqh;border-radius:1.2cqh;
  background:rgba(9,15,32,.94);box-shadow:0 0 0 1px rgba(90,140,210,.35);white-space:nowrap}
.coinStage .sideTxt.back{color:#9fb4d8}
.coinStage .sideDesc{position:absolute;left:50%;top:79.5%;transform:translateX(-50%);margin:0;
  font-size:1.5cqh;padding:.5cqh 2cqh;border-radius:2cqh;color:#cfe0ff;
  background:rgba(9,15,32,.94);box-shadow:0 0 0 1px rgba(90,140,210,.3);white-space:nowrap}
.coinStage .coinAct{position:absolute;left:0;right:0;bottom:4%;margin:0;text-align:center}
.bigBtn{padding:1.3cqh 5cqh;font-size:2cqh;font-weight:800;letter-spacing:.2em;border:none;border-radius:1cqh;
  background:#0a1020;color:#ffd95e;cursor:pointer;transition:.12s;box-shadow:0 .5cqh 0 #05080f}
.bigBtn:hover:not(:disabled){background:#152040}
.bigBtn:disabled{opacity:.55;cursor:default}

/* 三层结构：头像在背景【之下】（尺寸故意做大一圈，超出部分被机甲边框挡掉，
   所以就算素材有偏差也不会露白边）；UI 在背景之上。 */
#board{position:absolute;inset:0}
#avaLayer{position:absolute;inset:0;z-index:1}
#bgLayer{position:absolute;inset:0;z-index:2;pointer-events:none;background:#0b1020}
#uiLayer{position:absolute;inset:0;z-index:3}

/* 头像占位（透明槽位坐标 + 约 15% 外扩） */
.av{position:absolute;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,#4b5c86,#28324e);color:var(--gold2);font-weight:800;
  text-shadow:0 1px 5px rgba(0,0,0,.75)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
#avTop{left:21.3%;top:0.1%;width:9.7%;height:17.2%;border-radius:1.6cqh;font-size:4.6cqh}
#avBot{left:68.2%;top:79.5%;width:9.7%;height:17.2%;border-radius:1.6cqh;font-size:4.6cqh}
#avMiniTop{left:16.2%;top:36.6%;width:5.0%;height:8.9%;border-radius:50%;font-size:2cqh}
#avMiniBot{left:16.0%;top:55.6%;width:5.2%;height:9.2%;border-radius:50%;font-size:2cqh}

/* 血滴里的数字（血滴本身是图上画好的） */
.hpnum{position:absolute;display:grid;place-items:center;font-weight:900;
  font-variant-numeric:tabular-nums;text-shadow:0 .2cqh .5cqh rgba(0,0,0,.5)}
#hpTop{left:32.88%;top:5.56%;width:4.13%;height:8.0%;color:#fff6f2;font-size:2.6cqh}
#hpBot{left:62.2%;top:84.8%;width:5.0%;height:8.9%;color:#eef7ff;font-size:2.6cqh}

/* 技能说明：写进图上那条深色横幅里，并避开血滴 */
.skillbox{position:absolute;font-size:1.28cqh;line-height:1.55;color:#dbe6f7;overflow:hidden}
.skillbox b{color:var(--cyan)}
#skillTop{left:38.4%;top:4.0%;width:34.2%;height:11.0%}
#skillBot{left:40.0%;top:83.4%;width:22.0%;height:11.0%}

/* 名牌 */
.nameTag{position:absolute;font-size:1.7cqh;font-weight:800;color:var(--gold2);white-space:nowrap;
  text-shadow:0 1px 6px rgba(0,0,0,.95)}
#nameTop{left:22.4%;top:15.9%}
#nameBot{left:68.3%;top:95.2%}

/* 状态标签（愿力 / 水痕 / 蕴种印 / 石化…） */
.buffs{position:absolute;display:flex;gap:.5cqh;flex-wrap:wrap;align-items:center}
#buffTop{left:38.4%;top:16.5%;max-width:35%}
#buffBot{left:40.0%;top:78.4%;max-width:22%}
.bf{font-size:1.1cqh;padding:.15cqh .7cqh;border-radius:.9cqh;background:rgba(20,28,48,.92);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.bf.st{color:var(--gold2);border-color:var(--gold)}
.bf.hd{color:var(--purple);border-color:#5a4a86}
.bf.db{color:var(--red);border-color:#7a3a2e}

/* 左侧回合数（填进图上那个白色圆） */
#roundBox{position:absolute;left:16.45%;top:45.8%;width:4.70%;height:8.35%;
  display:grid;place-items:center;font-size:2.4cqh;font-weight:900;color:#ffffff;
  text-shadow:0 1px 0 rgba(255,255,255,.35)}

/* 中央：数值 + 骰子 */
#midBox{position:absolute;left:20%;top:23%;width:58%;height:55%;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqh}
/* 场地分红(对方,上)/蓝(我方,下)两半，各自半场显示自己的骰子 */
.diceZone{position:absolute;z-index:7;left:50%;transform:translateX(-50%);width:74%;
  display:flex;align-items:center;justify-content:center;gap:.7cqh;flex-wrap:wrap;
  min-height:11cqh;padding:.4cqh 1cqh;border-radius:1.4cqh}
#poolRow{top:19.0%}
#poolMine{top:66.0%}
.diceZone .plabel{font-size:1.35cqh;font-weight:700;color:#e8eeff;
  text-shadow:0 1px 4px rgba(0,0,0,.8);white-space:nowrap}
.diceZone.acting{background:rgba(245,199,74,.12);
  box-shadow:0 0 0 .18cqh rgba(245,199,74,.6),0 0 3cqh rgba(245,199,74,.28)}
#stageDice{display:none}
/* 中央两处数值固定按屏幕位置表达语义：上方敌方、下方我方。 */
.sumVal{position:absolute;z-index:8;left:20%;width:58%;pointer-events:none;
  display:flex;align-items:baseline;justify-content:center;gap:.55cqh;
  font-family:var(--font-title);font-size:4.9cqh;font-weight:900;line-height:1;
  color:#2f66c4;text-shadow:0 .25cqh .45cqh rgba(255,255,255,.55)}
.sumVal .sumSide{font-family:var(--font-ui);font-size:1.45cqh;font-weight:800;color:#53658c;
  text-shadow:none;white-space:nowrap}
.sumVal .sumNum{font-variant-numeric:tabular-nums}
.sumVal .sumTail{font-family:var(--font-ui);font-size:1.35cqh;font-weight:700;color:#53658c;
  text-shadow:none;white-space:nowrap}
.sumVal.dim{color:#9fb0cf}
.sumVal.dim .sumSide,.sumVal.dim .sumTail{color:#8e9bb7}
#oppTotal{top:34.5%}
#myTotal{top:53.5%}
#bigVal{font-family:var(--font-title);font-size:8.4cqh;font-weight:900;line-height:1;color:#2f66c4;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.3cqh;
  text-shadow:0 .3cqh 0 rgba(255,255,255,.5);display:none}
#bigVal .plus{font-size:4.4cqh;color:#e0a020}
#bigVal.dim{color:#9fb0cf}
#bigVal.dim .plus{color:#b9a888}
#vsLine{font-size:1.5cqh;color:#3f5480;min-height:1.9cqh;text-align:center;font-weight:600}
#stageDice{display:flex;gap:1.6cqh;flex-wrap:wrap;justify-content:center;align-items:center;min-height:10.6cqh;padding:.6cqh 0}
#hintTxt{font-size:1.2cqh;color:#54648c;text-align:center;line-height:1.6;max-width:92%;min-height:1.6cqh}
#hintTxt b{color:#2f66c4}

/* 右侧热区：重投 / 确认 就是图上保留的那两个按钮，王牌骰压在黄色圆上。
   禁用时【不加暗底】，避免出现和图上圆错位的黑圆。 */
.hot{position:absolute;background:transparent;border:none;cursor:pointer;padding:0;
  transition:.15s;border-radius:1.2cqh}
.hot:hover:not(:disabled){background:rgba(255,255,255,.20);box-shadow:0 0 0 .2cqh rgba(255,255,255,.55)}
.hot:disabled{cursor:not-allowed;background:transparent;box-shadow:none}
#hotAce{left:89.05%;top:41.36%;width:6.50%;height:11.56%;border-radius:50%}
#hotReroll{left:87.88%;top:60.00%;width:8.25%;height:14.67%;border-radius:50%}
#hotOk{left:87.88%;top:78.00%;width:8.25%;height:14.67%;border-radius:50%}
/* 王牌骰的文字：压在黄色圆里 */
.aceLabel{position:absolute;pointer-events:none;text-align:center;line-height:1.15;font-weight:900}
#aceTop{left:83.7%;top:34.9%;width:16.56%;text-align:center;font-size:1.45cqh;color:#c8d8f4}

/* =====================================================================
   鎴樻枟鍔ㄧ敾锛氶瀛愰€愪釜钀戒綅 / 鏀诲嚮鏂瑰墠鍘?/ 鍙楀嚮鎶栧姩 / 瀹屽叏鏍兼尅 / 闇囧睆
   ===================================================================== */
@keyframes dieIn{
  0%{transform:translateY(-2.6cqh) scale(.55) rotate(-20deg);opacity:0}
  55%{transform:translateY(.4cqh) scale(1.08) rotate(4deg);opacity:1}
  100%{transform:translateY(-.4cqh) scale(1) rotate(0)}
}

.die.sel{transform:translateY(-.4cqh)}

@keyframes lunge{
  0%{transform:scale(1);filter:none}
  38%{transform:scale(1.16);filter:brightness(1.35)}
  100%{transform:scale(1);filter:none}
}
.glowTop.lunge,.glowBot.lunge{opacity:1;animation:lunge .46s ease-out}

@keyframes hitShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(-1.3cqh,.5cqh) rotate(-3.5deg)}
  28%{transform:translate(1.1cqh,-.5cqh) rotate(3.5deg)}
  44%{transform:translate(-.85cqh,.35cqh) rotate(-2.4deg)}
  60%{transform:translate(.6cqh,-.25cqh) rotate(1.6deg)}
  78%{transform:translate(-.3cqh,.12cqh) rotate(-.6deg)}
}
.glowTop.hit,.glowBot.hit{opacity:1;animation:hitShake .5s ease-out;
  box-shadow:0 0 3cqh .8cqh rgba(242,96,74,.9) inset,0 0 2cqh rgba(242,96,74,.75)}

@keyframes blockedPulse{
  0%{opacity:0;box-shadow:0 0 0 0 rgba(120,200,255,0)}
  25%{opacity:1;box-shadow:0 0 2.4cqh 1cqh rgba(120,200,255,.95) inset,0 0 2cqh rgba(120,200,255,.8)}
  100%{opacity:0;box-shadow:0 0 0 0 rgba(120,200,255,0)}
}
.glowTop.blocked,.glowBot.blocked{animation:blockedPulse .62s ease-out}

@keyframes quake{
  0%,100%{transform:translate(0,0)}
  18%{transform:translate(-.55cqh,.4cqh)}
  36%{transform:translate(.5cqh,-.35cqh)}
  54%{transform:translate(-.35cqh,.24cqh)}
  72%{transform:translate(.24cqh,-.16cqh)}
  88%{transform:translate(-.1cqh,.07cqh)}
}
#board.quake{animation:quake .4s ease-out}

@keyframes dmgPop{
  0%{transform:scale(.3) rotate(-8deg);opacity:0}
  22%{transform:scale(1.3) rotate(3deg);opacity:1}
  42%{transform:scale(1.02) rotate(0);opacity:1}
  72%{transform:scale(1.06);opacity:1}
  100%{transform:scale(1.6);opacity:0}
}
.flash .dmg{animation:dmgPop .95s cubic-bezier(.2,.8,.3,1) forwards}
@media (prefers-reduced-motion: reduce){
  .die,.glowTop.lunge,.glowBot.lunge,.glowTop.hit,.glowBot.hit,
  .glowTop.blocked,.glowBot.blocked,#board.quake,.flash .dmg{animation:none!important}
}

#rerollCount{font-size:1.2cqh;color:#8da0c9;min-height:1.6cqh;text-align:center;line-height:1.4}

/* =====================================================================
   Combat VFX: rolling dice, attack beam, defence shield that shatters
   ===================================================================== */
/* --- dice roll: a whole die tumbles across the board, then shows the face --- */
#stageDice{perspective:90cqh;perspective-origin:50% 40%}
@keyframes dieTumble{
  0%  {transform:translate3d(-12%,-22cqh,-8cqh) rotate(calc(var(--spin) * -.12)) scale(.55);
       opacity:0;filter:blur(.12cqh)}
  6%  {opacity:1}
  26% {transform:translate3d(-6%,-5cqh,-2cqh) rotate(calc(var(--spin) * .22)) scale(1.24);
       filter:blur(.07cqh)}
  48% {transform:translate3d(-2%,2.4cqh,0) rotate(calc(var(--spin) * .5)) scale(.86,.72);
       filter:blur(0)}
  60% {transform:translate3d(-1%,-.6cqh,0) rotate(calc(var(--spin) * .68)) scale(1.08,.96)}
  74% {transform:translate3d(0,1.1cqh,0) rotate(calc(var(--spin) * .84)) scale(.95,1.03)}
  88% {transform:translate3d(0,-1.4cqh,0) rotate(calc(var(--spin) * .95)) scale(1.03)}
  100%{transform:translate3d(0,-.7cqh,0) rotate(var(--spin)) scale(1);opacity:1;filter:blur(0)}
}
.die.sp.roll{animation:dieTumble 2.4s cubic-bezier(.24,.7,.3,1) backwards;
  will-change:transform,filter}
.solid{position:relative;width:7.2cqh;height:7.2cqh;transform-style:preserve-3d;
  will-change:transform}
.solid .fc{position:absolute;inset:0;display:grid;place-items:center;
  font-size:2.5cqh;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 .2cqh .5cqh rgba(0,0,0,.55);backface-visibility:hidden}
/* ---- cube (d6) ---- */
.solid.cube .fc{border-radius:.7cqh;
  background:linear-gradient(150deg,#cd9dff,#6a37c8);
  border:.16cqh solid rgba(255,255,255,.5);
  box-shadow:inset 0 0 1.8cqh rgba(255,255,255,.32)}
.cube .f1{transform:translateZ(3.6cqh)}
.cube .f2{transform:rotateY(180deg) translateZ(3.6cqh)}
.cube .f3{transform:rotateY(90deg)  translateZ(3.6cqh)}
.cube .f4{transform:rotateY(-90deg) translateZ(3.6cqh)}
.cube .f5{transform:rotateX(90deg)  translateZ(3.6cqh)}
.cube .f6{transform:rotateX(-90deg) translateZ(3.6cqh)}
/* ---- tetrahedron (d4) ---- */
.solid.tetra .fc{clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:linear-gradient(180deg,#7fe6ff,#1f8fc4);
  transform-origin:50% 100%;align-items:end;padding-bottom:.5cqh;
  text-shadow:0 .2cqh .5cqh rgba(0,0,0,.5)}
.tetra .f1{transform:rotateX(19.47deg) rotateY(0deg)   translateZ(0) translateY(-49.2%)}
.tetra .f2{transform:rotateX(19.47deg) rotateY(120deg) translateZ(0) translateY(-49.2%)}
.tetra .f3{transform:rotateX(19.47deg) rotateY(240deg) translateZ(0) translateY(-49.2%)}
.tetra .f4{transform:rotateX(-90deg) translateZ(-49.2%)}
@keyframes solidRoll{
  0%  {transform:translate3d(-14%,-20cqh,-18cqh) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(.65);opacity:0}
  7%  {opacity:1}
  30% {transform:translate3d(-7%,-5cqh,-6cqh) rotateX(calc(var(--rx) * .38)) rotateY(calc(var(--ry) * .34)) rotateZ(calc(var(--rz) * .45)) scale(1.18)}
  58% {transform:translate3d(-2%,1.8cqh,0) rotateX(calc(var(--rx) * .7)) rotateY(calc(var(--ry) * .68)) rotateZ(calc(var(--rz) * .8)) scale(.93)}
  80% {transform:translate3d(0,-2cqh,0) rotateX(calc(var(--rx) * .92)) rotateY(calc(var(--ry) * .92)) rotateZ(calc(var(--rz) * .96)) scale(1.04)}
  100%{transform:translate3d(0,0,0) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(1);opacity:1}
}
.solid.roll{animation:solidRoll var(--dur,2.6s) cubic-bezier(.22,.7,.3,1) backwards}

/* --- attack beam --- */
/* particle stream: a soft travelling core plus a swarm of sparks */
/* the attacker's portrait flies across the board and slams into the defender */
#ram{position:absolute;z-index:8;pointer-events:none;opacity:0;
  transition:opacity .22s linear;border-radius:1.7cqh;
  width:10.3%;height:17.8%;overflow:hidden;
  background-color:#1b2237;background-repeat:no-repeat;background-size:cover;
  background-position:center;
  border:.32cqh solid rgba(255,232,150,1);
  box-shadow:0 0 3.4cqh rgba(255,214,96,1),0 0 7cqh rgba(255,162,40,.7),
             inset 0 0 2.2cqh rgba(255,206,110,.5)}

@keyframes ramGo{
  0%  {transform:translate(0,0) scale(1)}
  10% {transform:translate(calc(var(--tx) * .04),calc(var(--ty) * .04)) scale(1.14)}
  48% {transform:translate(var(--tx),var(--ty)) scale(1.2)}
  54% {transform:translate(var(--tx),var(--ty)) scale(.84)}
  60% {transform:translate(var(--tx),var(--ty)) scale(1.08)}
  70% {transform:translate(var(--tx),var(--ty)) scale(1)}
  100%{transform:translate(var(--tx),var(--ty)) scale(1)}
}
/* 不透明由 class 控制，撞击姿态停住后淡出，没有回程 */
#ram.go{opacity:.667;animation:ramGo 3.8s cubic-bezier(.32,.68,.28,1) forwards}
@keyframes ramImpact{
  0%,100%{opacity:0}
  6%{opacity:1}
  40%{opacity:.9}
  100%{opacity:0}
}
#ram.go::after{content:'';position:absolute;inset:-30%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,230,.9) 0%,rgba(255,206,110,.5) 34%,transparent 68%);
  animation:ramImpact 3.8s ease-out forwards}
.beam{position:absolute;height:6cqh;transform-origin:0 50%;pointer-events:none;opacity:0;z-index:6;
  transform:rotate(var(--ang,0deg))}
.beam.on{opacity:1}
.beam::before{content:'';position:absolute;left:0;top:50%;width:100%;height:1.5cqh;
  transform:translateY(-50%);border-radius:1cqh;
  background:linear-gradient(90deg,rgba(150,225,255,0),rgba(190,240,255,.55) 22%,#ffffff 55%,rgba(190,240,255,.5) 82%,rgba(150,225,255,0));
  filter:blur(.35cqh);
  animation:coreSweep 1s ease-out forwards}
@keyframes coreSweep{
  0%{opacity:0;transform:translateY(-50%) scaleX(.05)}
  22%{opacity:1;transform:translateY(-50%) scaleX(1)}
  70%{opacity:.9;transform:translateY(-50%) scaleX(1)}
  100%{opacity:0;transform:translateY(-50%) scaleX(1)}
}
.pt{position:absolute;top:50%;width:.9cqh;height:.9cqh;margin:-.45cqh 0 0 -.45cqh;border-radius:50%;
  background:radial-gradient(circle,#ffffff 0%,#d8f4ff 38%,rgba(120,205,255,.85) 65%,transparent 100%);

}
.pt.spark{width:.5cqh;height:.5cqh;margin:-.25cqh 0 0 -.25cqh;

  box-shadow:0 0 .6cqh rgba(255,230,160,.95)}

/* --- defence shield --- */
/* golden rim light hugging the portrait frame -- reads as edge lighting on
   the character rather than a glass ball sitting in front of them */
.shield{position:absolute;pointer-events:none;opacity:0;z-index:5;border-radius:1.7cqh;
  box-shadow:
    0 0 0 .42cqh rgba(255,236,170,.95),
    0 0 2.4cqh .35cqh rgba(255,206,92,.85),
    0 0 5.5cqh 1cqh rgba(255,168,44,.55),
    0 0 10cqh 2cqh rgba(255,146,24,.28),
    inset 0 0 2.6cqh rgba(255,226,152,.75),
    inset 0 0 .7cqh .35cqh rgba(255,246,205,.95)}
.shield::after{content:'';position:absolute;inset:-11%;border-radius:2.4cqh;
  background:
    radial-gradient(circle at 8% 30%, rgba(255,244,190,.95) 0 .30cqh, transparent .5cqh),
    radial-gradient(circle at 94% 22%, rgba(255,238,180,.9) 0 .24cqh, transparent .42cqh),
    radial-gradient(circle at 90% 78%, rgba(255,248,200,.85) 0 .27cqh, transparent .45cqh),
    radial-gradient(circle at 12% 74%, rgba(255,242,190,.8) 0 .22cqh, transparent .4cqh);
  animation:rimSpark 1.05s ease-in-out infinite alternate}
@keyframes rimSpark{from{opacity:.35;transform:scale(.98)}to{opacity:1;transform:scale(1.03)}}
#shieldTop{left:21.0%;top:-0.2%;width:10.3%;height:17.8%}
#shieldBot{left:67.9%;top:79.2%;width:10.3%;height:17.8%}
@keyframes rimOn{0%{opacity:0;filter:brightness(1)}100%{opacity:1;filter:brightness(1.5)}}
.shield.on{animation:rimOn .45s ease-out forwards}
@keyframes rimOff{0%{opacity:1;filter:brightness(1.5)}100%{opacity:0;filter:brightness(1)}}
.shield.fade{animation:rimOn .45s ease-out forwards,rimOff .55s ease-in .45s forwards}
/* shatter: flash bright, blow outward, vanish */
@keyframes shieldBreak{
  0%  {opacity:1;transform:scale(1);filter:brightness(1)}
  38% {opacity:1;transform:scale(1.13);filter:brightness(2.1)}
  100%{opacity:0;transform:scale(1.55);filter:brightness(2.4)}
}
.shield.brk{animation:shieldBreak .52s ease-out forwards}
@keyframes shieldQuake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-.6cqh,.35cqh)}
  50%{transform:translate(.55cqh,-.3cqh)}
  75%{transform:translate(-.3cqh,.15cqh)}
}
.shield.brk{animation:shieldBreak .52s ease-out forwards,shieldQuake .38s ease-out}
/* stage dice when using 3D solids: no sprite background, just a holder */
.die.holder{background:none!important;clip-path:none!important;width:7.2cqh;height:7.2cqh}

const R = n => 1 + Math.floor(Math.random()*n);

const vals = d => d.map(x=>x.v);
const sumDice = d => sum(vals(d));
const hasPair = a => new Set(a).size < a.length;
const hasGap  = a => { const s=new Set(a); for (const v of s) if (s.has(v+1)) return true; return false; };
const dshape = f => ({4:'f4',6:'f6',8:'f8',10:'f10'})[f] || 'f6';
function applyAce(id, dice){
  const a = ACES[id]; if (!a) return;
  const raise=(i,t)=>{ const tt=Math.min(t,dice[i].f); if (tt>dice[i].v) dice[i].v=tt; };
  if (a.kind==='lowTo'){
    let li=-1; for (let i=0;i<dice.length;i++) if (li<0||dice[i].v<dice[li].v) li=i;
    if (li>=0) raise(li,a.n);
  } else if (a.kind==='lowTwoTo'){
    for (let k=0;k<2;k++){
      let li=-1;
      for (let i=0;i<dice.length;i++){ if (dice[i].v>=a.n) continue; if (li<0||dice[i].v<dice[li].v) li=i; }
      if (li>=0) raise(li,a.n);
    }
  } else if (a.kind==='add'){
    for (let i=0;i<a.n;i++) dice.push({ v:R(a.face), f:a.face });
  }
}

function mkSide(id, human){
  const c=CARDS[id];
  return { id, human, name:c.name, hp:c.hp, maxHp:c.hp,

    permanentDice:[], atkBonus:0, defBonus:0, moonStacks:0,
    moonChoices:{ dice:false, atk:false, def:false } };
}
function healSide(s,amt){ const r=Math.max(0,Math.min(s.maxHp,s.hp+amt)-s.hp); s.hp+=r; return r; }
function buildPool(A, kind, useXiao){
  const c = CARDS[A.id];
  const extra = [];
  if (kind==='atk'){
    if (A.id==='xiao' && useXiao) for (let i=0;i<TUNE.xiaoDice;i++) extra.push(4);
    if (A.id==='raiden' && A.stacks>=TUNE.raidenCap){
      for (let i=0;i<A.stacks*TUNE.raidenDicePer;i++) extra.push(6);
      A.stacks = 0;
    }
    for (const f of A.bonusDice) extra.push(f);
  }
  let all = c.pool.concat(A.permanentDice, extra);
  const penalty = kind==='atk' ? A.atkPenalty : A.defPenalty;
  for (let i=0;i<penalty && all.length>1;i++){
    let bi=0; for (let k=1;k<all.length;k++) if (all[k]>all[bi]) bi=k;
    all = all.filter((_,k)=>k!==bi);
  }
  if (kind==='atk') A.atkPenalty=0; else A.defPenalty=0;
  return all;
}
const rollPool = pool => pool.map(f => ({ v:R(f), f, sel:true }));
function autoSelect(dice, n){
  const sorted = dice.slice().sort((a,b)=>b.v-a.v).slice(0, n);
  const keep = new Set(sorted);
  dice.forEach(d => { d.sel = keep.has(d); });
}

function resolve(A, D, atkDice, defDice, ctx){
  const ev=[], CA=CARDS[A.id], CD=CARDS[D.id];
  const av = vals(atkDice);
  let atkVal=sum(av), defVal=sumDice(defDice);
  let dmgMul=1, flat=0, pierce=0, ignoreDefense=false;

  if (A.id==='hutao'){
    if (av.filter(v=>v%2===1).length >= TUNE.hutaoOdd && A.hp > TUNE.hutaoSelf){
      A.hp -= TUNE.hutaoSelf; dmgMul=TUNE.hutaoMul; flat+=TUNE.hutaoFlat;
      if (A.hp<=10) flat+=TUNE.hutaoLowBonus;
      ev.push(`「${CA.skill}」发动（奇数 ${av.filter(v=>v%2===1).length} 颗）· 自损 ${TUNE.hutaoSelf}，伤害 ×${TUNE.hutaoMul}`);
    }
  }
  if (A.id==='bennett'){
    if (atkVal<=TUNE.bennettLow){
      const h=healSide(A,TUNE.bennettHeal);
      ev.push(`「${CA.skill}」发动（${atkVal} ≤ ${TUNE.bennettLow}）· 回复 ${h} 点生命`);
    } else if (atkVal>=TUNE.bennettHigh){
      flat+=TUNE.bennettFlat;
      ev.push(`「${CA.skill}」发动（${atkVal} ≥ ${TUNE.bennettHigh}）· 伤害 +${TUNE.bennettFlat}`);
    }
  }
  let hold=false;
  if (A.id==='trilune'){
    if (!ctx.frostFollowup && atkDice.some(d=>d.v===d.f)){
      hold=true; A.moonStacks++;
      ev.push('「霜月权能」发动 · 选中最大面，本次攻击后立即再攻击一次；新月 +1');
    }
    if (atkVal%3===0){
      ignoreDefense=true; A.moonStacks++;
      ev.push('「虹月权能」发动 · 攻击和值为 3 的倍数，无视本次防御；新月 +1');
    }
    if (defVal>atkVal){
      let changed=0;
      atkDice.forEach(d=>{
        if (d.v<d.f){ d.v=d.f; changed++; }
      });
      if (changed){
        atkVal=sumDice(atkDice); A.moonStacks+=changed;
        ev.push(`「恒月权能」发动 · ${changed} 颗攻击骰变为最大面；新月 +${changed}`);
      }
    }
  }
  if (A.id==='venti'){
    const ok = TUNE.ventiCond==='pair' ? hasPair(av) : hasGap(av);
    if (ok){ dmgMul*=TUNE.ventiHalve; hold=true;
      if (TUNE.ventiPenalty) D.atkPenalty+=TUNE.ventiPenalty;
      ev.push(`「${CA.skill}」发动 · 伤害减半，但可立即再进攻一次`); }
  }
  if (A.id==='ayaka' && hasPair(av)){
    D.defPenalty+=1; flat+=TUNE.ayakaFlat;
    ev.push(`「${CA.skill}」发动 · 伤害 +${TUNE.ayakaFlat}，对手下回合防御骰 −1`);
  }
  if (A.id==='nahida' && hasPair(av) && D.marks>0){
    const p=TUNE.nahidaMark*D.marks; pierce+=p;
    ev.push(`「${CA.skill}」引爆 ${D.marks} 层 · 无视防御 ${p} 点`); D.marks=0;
  }
  if (A.id==='columb' && A.stacks>=3){
    let s=0; for (let i=0;i<TUNE.columbDice;i++) s+=R(6);
    pierce+=s; A.stacks=0;
    ev.push(`「万古潮汐」满层 · 矩波干涉 ${s} 点无视防御伤害`);
  }
  if (A.id==='neuvil' && A.stacks>=3){
    flat+=TUNE.neuvilFlat; const h=healSide(A,TUNE.neuvilHeal); A.stacks=0;
    ev.push(`「${CA.skill}」满层 · +${TUNE.neuvilFlat} 固定伤害，回复 ${h} 点生命`);
  }
  if (ctx.xiaoBurst){ flat+=ctx.xiaoBurst; ev.push(`「${CA.skill}」三连爆发 · 伤害 +${ctx.xiaoBurst}`); }

  if (D.id==='zhongli' && defVal>=TUNE.zhongliDefThresh){
    defVal+=TUNE.zhongliDef; A.atkPenalty+=TUNE.zhongliPetrify;
    ev.push(`「${CD.skill}」发动 · 防御 +${TUNE.zhongliDef}，石化对手`);
  }

  const effectiveDefVal = ignoreDefense ? 0 : defVal;
  const dmg = Math.max(0, Math.floor(Math.max(0,atkVal-effectiveDefVal)*dmgMul)+flat+pierce);
  const absorbed = Math.min(D.shield, dmg);
  D.shield-=absorbed; D.hp-=(dmg-absorbed);
  if (absorbed) ev.push(`护盾抵消 ${absorbed} 点伤害`);

  const hit = dmg>0;
  if (A.id==='raiden' && hit) A.stacks=Math.min(TUNE.raidenCap,A.stacks+1);
  if (A.id==='neuvil') A.stacks=Math.min(3,A.stacks+1);
  if (A.id==='columb') A.stacks=Math.min(3,A.stacks+1);
  if (A.id==='nahida' && hit){ D.marks=Math.min(3,D.marks+1); ev.push(`对手被挂上蕴种印（${D.marks} 层）`); }

  if (D.id==='xingqiu' && effectiveDefVal>=atkVal){
    for (let i=0;i<TUNE.xingqiuDice;i++) D.bonusDice.push(6);
    ev.push(`「${CD.skill}」防御成功 · 下回合骰池 +${TUNE.xingqiuDice} 颗六面骰`);
  }
  if (D.id==='ganyu' && vals(defDice).filter(v=>v%2===0).length>=TUNE.ganyuEven){
    D.bonusDice.push(TUNE.ganyuBonusFaces);
    ev.push(`「${CD.skill}」发动 · 下次攻击骰池 +1 颗六面骰`);
  }
  if (A.id!=='xiao') A.xiaoStreak=0;
  return { atkVal, defVal:effectiveDefVal, rawDefVal:defVal, ignoreDefense, dmg, absorbed, ev, hold };
}
function previewBonus(A, D, dice){
  const av=vals(dice), s=sum(av);
  let flat=0;
  if (A.id==='hutao' && av.filter(v=>v%2===1).length>=TUNE.hutaoOdd) flat+=TUNE.hutaoFlat;
  if (A.id==='bennett' && s>=TUNE.bennettHigh) flat+=TUNE.bennettFlat;
  if (A.id==='ayaka' && hasPair(av)) flat+=TUNE.ayakaFlat;
  if (A.id==='nahida' && hasPair(av) && D.marks>0) flat+=TUNE.nahidaMark*D.marks;
  if (A.id==='neuvil' && A.stacks>=3) flat+=TUNE.neuvilFlat;
  return flat;
}
function aiWantReroll(A, D, dice, diff, isAtk){
  if (diff==='easy') return false;
  const cur=sumDice(dice);
  if (isAtk && cur >= D.hp+D.shield) return false;
  // crazy: reroll whenever ANY selected die sits below its own expectation
  if (diff === 'crazy'){
    const sel = dice.filter(d => d.sel !== false);
    return sel.some(d => d.v < (d.f + 1) / 2);
  }
  const cap = CARDS[A.id][isAtk?'atkCap':'defCap'] + (isAtk ? A.atkBonus : A.defBonus);
  const avg = dice.slice().sort((a,b)=>b.v-a.v).slice(0, cap).reduce((a,d)=>a+(d.f+1)/2,0);
  const th = diff==='normal' ? 0.86 : (diff==='hard' ? 0.94 : 1.04);   // crazy 最激进
  return cur < avg*th;
}

/* light beam from the attacker's avatar to the defender's avatar */
function fireBeam(attackerHuman, attackerId){
  const a = sidePt(attackerHuman), b = sidePt(!attackerHuman);
  /* 舞台宽高比实测（窗口自适应时不再是 16:9）。
     k = 宽/高，用来把「宽度的百分比」换算成 cqh（= 高度的百分比）。 */
  const stEl = $('app');
  const stR = stEl ? stEl.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
  const k = stR.height ? stR.width / stR.height : 16/9;
  const dx = (b.x-a.x)*k/100, dy = (b.y-a.y)/100;          // 统一换成「舞台高度」单位
  const ang = Math.atan2(dy,dx)*180/Math.PI;
  const len = Math.hypot(dx,dy)/k*100;                     // as % of stage width
  const el = $('beam');
  el.style.left = a.x + '%';
  el.style.top  = a.y + '%';
  el.style.width = len + '%';
  el.style.setProperty('--ang', ang + 'deg');
  el.innerHTML = '';
  for (let i = 0; i < 20; i++){
    const p = document.createElement('span');
    const spark = i % 3 === 0;
    p.className = 'pt' + (spark ? ' spark' : '');
    p.style.left = (2 + Math.random()*20) + '%';
    p.style.setProperty('--tx', (60 + Math.random()*42) + '%');
    p.style.setProperty('--ty', ((Math.random()-0.5)*7).toFixed(1) + 'cqh');
    p.style.animationDelay = (Math.random()*0.42).toFixed(2) + 's';
    el.appendChild(p);
  }
  el.classList.add('on');
  void el.offsetWidth;
  el.classList.remove('on');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.classList.remove('on'); el.innerHTML = ''; }, 1550);
  // portrait ram
  const ram = $('ram');
  const atk = AVA_IMG[attackerId];
  ram.style.backgroundImage = (atk ? `url('${asset(atk)}'), ` : '') +
    'linear-gradient(180deg, #24304e 0%, #141a2b 100%)';
  /* #ram 的尺寸是 10.3% × 17.8%（见 CSS），这里取精确一半，
     ram 的中心才会正好落在攻方头像中心上；两个数字改动时要一起改。 */
  ram.style.left = a.x - 5.15 + '%';
  ram.style.top  = a.y - 8.9 + '%';
  ram.style.setProperty('--tx', ((b.x - a.x) * k).toFixed(2) + 'cqh');
  ram.style.setProperty('--ty', ((b.y - a.y)).toFixed(2) + 'cqh');
  ram.classList.remove('go'); void ram.offsetWidth;
  ram.classList.add('go');
  clearTimeout(ram._t);
  ram._t = setTimeout(() => ram.classList.remove('go'), 3300);
}
/* dice tumble: cycle random faces while the roll animation plays */
/* The user's dice art is already a 3D render, so the sprites ARE the dice --
   a CSS-built solid looked noticeably worse. The roll is therefore a heavy
   tumble: drop in, squash on impact, bounce, settle. */
/* pool-row minis share the same tumble so both sides visibly roll */
function rollAnimPool(els){
  els.forEach(e => {
    e.classList.add('roll');
    e.style.setProperty('--spin', (450 + Math.ceil(Math.random()*3)*360) + 'deg');
    e.style.animationDuration = (1.6 + Math.random()*0.8).toFixed(2) + 's';
    e.style.animationDelay = (Math.random()*0.28).toFixed(2) + 's';
    setTimeout(()=>e.classList.remove('roll'), 2700);
  });
}
/* pool-row minis tumble too, so both sides visibly roll */
function rollAnimPool(els){
  els.forEach(e => {
    e.classList.add('roll');
    e.style.setProperty('--spin', (450 + Math.ceil(Math.random()*3)*360) + 'deg');
    e.style.animationDuration = (1.6 + Math.random()*0.8).toFixed(2) + 's';
    e.style.animationDelay = (Math.random()*0.28).toFixed(2) + 's';
    setTimeout(()=>e.classList.remove('roll'), 2700);
  });
}
function rollAnim(dice, els){
  els.forEach((e,i) => {
    e.classList.add('roll');
    e.style.setProperty('--spin', (540 + Math.ceil(Math.random()*3)*360) + 'deg');
    e.style.setProperty('--tilt', (-40 - Math.random()*50).toFixed(0) + 'deg');
    e.style.animationDuration = (1.9 + Math.random()*0.9).toFixed(2) + 's';
    e.style.animationDelay = (Math.random()*0.3).toFixed(2) + 's';
  });
  const t0 = performance.now();
  els.forEach(e => {
    e.style.setProperty('--rx', (720 + Math.random()*900).toFixed(0) + 'deg');
    e.style.setProperty('--ry', (900 + Math.random()*1080).toFixed(0) + 'deg');
    e.style.setProperty('--rz', (180 + Math.random()*540).toFixed(0) + 'deg');
    e.style.animationDuration = (1.7 + Math.random()*0.9).toFixed(2) + 's';
    e.style.animationDelay = (Math.random()*0.25).toFixed(2) + 's';
  });
  const iv = setInterval(() => {
    if (performance.now() - t0 > 3100){
      clearInterval(iv);
      els.forEach((e,i)=>{ e.textContent = dice[i].v; e.classList.remove('roll'); });
      return;
    }
    els.forEach((e,i)=>{ e.textContent = 1 + Math.floor(Math.random()*dice[i].f); });
  }, 62);
}

async function prepare(youId){
  if (youId==='trilune'){
    await askModal(
      '该角色过于强力，请谨慎选择。',
      [{key:'ack',label:'我知道了',pri:true}]
    );
  }
  let aiId, diff;
  if (S.mode==='story'){
    const st = STORY[S.stage];
    if (!st) return;
    aiId = st.opp; diff = st.diff;
  } else {
    const pool=IDS.filter(x=>x!==youId);
    aiId=pool[Math.floor(Math.random()*pool.length)];
    diff=S.diff;
  }
  S.battleDiff = diff;
  let ley=null;
  if (S.leyPref==='random'){ const k=Object.keys(LEYLINES); ley=k[Math.floor(Math.random()*k.length)]; }
  S.ley=ley; TUNE.leyline=ley;
  TUNE.aceUses = (ley==='fengqi') ? 1 : (ley==='shenjing' ? 0 : 2);

  S.you=mkSide(youId,true); S.ai=mkSide(aiId,false);
  if (diff==='crazy'){ S.ai.maxHp += 3; S.ai.hp += 3; }   // 鐤媯妗ｏ細绾补鐨勮€愪箙鍔犳垚
  for (const s of [S.you,S.ai]){
    if (ley==='pingyong'){ s.maxHp+=4; s.hp+=4; }
    if (ley==='yanmai') s.shield=4;
    if (ley==='shenjing') s.aceLeft=0;
  }
  S.second=null;
  S.lastHuman=null; S.lastAi=null;
  S.lastHumanSelected=null; S.lastAiSelected=null;
  setBattleSums(null, null);

  $('startYouAva').innerHTML=avaInner(S.you.id); $('startYouName').textContent=S.you.name;
  $('startYouRole').textContent=CARDS[youId].role;
  $('startAiAva').innerHTML=avaInner(S.ai.id); $('startAiName').textContent=S.ai.name;
  $('startAiRole').textContent=CARDS[aiId].role;
  $('coinSide').style.visibility='hidden'; $('coinDesc').style.visibility='hidden';
  $('coinEl').className='coin'; $('coinEl').innerHTML='<span class="face">✦</span>';
  $('btnCoin').textContent='投 掷'; $('btnCoin').disabled=false;
  $('btnCoin').onclick=doCoin;
  show('s-start');
}
$('btnStart').onclick = () => show('s-coin');

/* ---------- 回合 ---------- */
async function triggerNewMoon(A){
  if (A.id!=='trilune' || A.moonStacks<3) return;
  const available = [
    { key:'dice', label:'获得一个六面骰', desc:'骰池永久 +1 颗六面骰' },
    { key:'atk', label:'攻击层数 +1', desc:'攻击选骰上限永久 +1' },
    { key:'def', label:'防御层数 +1', desc:'防御选骰上限永久 +1' },
  ].filter(o=>!A.moonChoices[o.key]);
  if (!available.length) return;

  A.moonStacks-=3;
  let choice=available[0].key;
  if (A.human){
    choice=await askModal(
      '「新月终临」发动<br>消耗 <b>3</b> 层新月，选择一项本局永久强化（已选项不会再次出现）。',
      available.map((o,i)=>({ key:o.key, label:o.label, pri:i===0 }))
    );
  } else {
    choice=available[0].key;
  }
  A.moonChoices[choice]=true;
  if (choice==='dice') A.permanentDice.push(6);
  if (choice==='atk') A.atkBonus++;
  if (choice==='def') A.defBonus++;
}

async function beginTurn(){
  if (S.over) return;
  const A = S.attacker===0 ? S.you : S.ai;
  const D = S.attacker===0 ? S.ai : S.you;
  paint();

  await triggerNewMoon(A);
  paint();

  let useXiao=false;
  if (A.id==='xiao' && A.hp>TUNE.xiaoSelf){
    if (A.human){
      const k = await askModal(
        `是否发动「靖妖傩舞」？<br>自损 <b>${TUNE.xiaoSelf}</b> 点生命，本回合骰池额外加 <b>${TUNE.xiaoDice}</b> 颗四面骰${A.xiaoStreak>=2?'，并触发三连爆发':''}`,
        [{key:'no',label:'正常攻击',pri:true},{key:'yes',label:`傩舞 · 自损 ${TUNE.xiaoSelf}`}]);
      useXiao = k==='yes';
    } else {
      await wait(320);
      useXiao = S.battleDiff==='crazy' ? A.hp > TUNE.xiaoSelf + 1 : A.hp > TUNE.xiaoSelf + 4;
    }
  }

  const pool = buildPool(A, 'atk', useXiao);
  const xiaoBurst = (A.id==='xiao' && A.xiaoStreak>=3) ? TUNE.xiaoBurst : 0;
  const dice = rollPool(pool);
  const atkRes = await selectPhase(A, D, dice, 'atk', { xiaoBurst });

  $('stageDice').innerHTML=''; $('poolRow').innerHTML='';
  await endTurn(A, D, atkRes, { xiaoBurst });
}

async function selectPhase(A, D, dice, kind, ctx){
  const isAtk = kind==='atk';
  const cap = CARDS[A.id][isAtk?'atkCap':'defCap'] + (isAtk ? A.atkBonus : A.defBonus);
  let rerolls = TUNE.rerolls;
  let aceUsed = false;
  let rerollMode = false;
  const yourTurn = A.human;
  const label = isAtk ? '攻击' : '防御';
  const aceTypeOk = ACES[A.id].type === kind || ACES[A.id].type === 'both';

  autoSelect(dice, cap);

  let curEls = [];
  const refresh = (opts) => {
    // 双方骰子各归各的半场：对方在红色上半场，我方在蓝色下半场
    const me  = A.human ? A : D;
    const foe = A.human ? D : A;
    const oppZone = $('poolRow'), myZone = $('poolMine');
    oppZone.innerHTML = ''; myZone.innerHTML = '';
    const paintZone = (zone, side, tag, isActor) => {
      zone.className = 'diceZone' + (isActor ? ' acting' : '');
      const lab = document.createElement('span'); lab.className = 'plabel';
      const poolSize = isActor ? dice.length : CARDS[side.id].pool.length + side.permanentDice.length;
      lab.textContent = `${tag} · ${side.name} 骰池 ${poolSize} 颗`;
      zone.appendChild(lab);
      const out = [];
      if (isActor) {
        dice.forEach((d,i)=>{ const el = dieEl(d, yourTurn ? {click:toggle,i} : {i}); out.push(el); zone.appendChild(el); });
        // 记住本手点数，轮到对方后依然显示数字
        const snap = dice.map(d => ({ f: d.f, v: d.v }));
        if (side.human) S.lastHuman = snap; else S.lastAi = snap;
      } else {
        const snap = side.human ? S.lastHuman : S.lastAi;
        const src = (snap && snap.length) ? snap : CARDS[side.id].pool.map(f => ({ f: f }));
        src.forEach(d => zone.appendChild(dieMini(d.f, d.v)));
      }
      return out;
    };
    const oppEls = paintZone(oppZone, foe, '对方', !yourTurn);
    const myEls  = paintZone(myZone,  me,  '我方', yourTurn);
    const els = yourTurn ? myEls : oppEls;
    curEls = els;
    if (opts && opts.roll){
      const rolledDice = opts.rolledDice || dice;
      const rolledEls = rolledDice.map(d=>els[dice.indexOf(d)]).filter(Boolean);
      rollAnim(rolledDice, rolledEls);
    }

    const sel = dice.filter(d=>d.sel!==false);
    const selectedSnap = sel.map(d => ({ f:d.f, v:d.v }));
    if (A.human) S.lastHumanSelected = selectedSnap;
    else S.lastAiSelected = selectedSnap;
    const opponentSum = yourTurn ? sumSnapshot(S.lastAiSelected || S.lastAi) : sumDice(sel);
    const playerSum = yourTurn ? sumDice(sel) : sumSnapshot(S.lastHumanSelected || S.lastHuman);
    setBattleSums(opponentSum, playerSum);
    setVal(sumDice(sel), previewBonus(A,D,sel), sel.length===0);
    $('vsLine').textContent = yourTurn
      ? (rerollMode
        ? `已选择 ${dice.filter(d=>d.reroll).length} 颗骰子重新投掷　·　骰池 ${dice.length} 颗`
        : `已选 ${sel.length} / ${cap}　·　骰池 ${dice.length} 颗`)
      : `${A.name} 正在选择${label}骰…`;

    if (yourTurn){
      const pickedForReroll = dice.filter(d=>d.reroll).length;
      $('rerollTxt').textContent = rerollMode
        ? (pickedForReroll ? '确认投掷' : '取消重新投掷')
        : '重新投掷';
      $('rerollCount').textContent = `${rerolls}/${TUNE.rerolls}`;
      $('selectCount').textContent = rerollMode ? '' : `${sel.length}/${cap}`;
      $('hintTxt').innerHTML = rerollMode
        ? '点击任意骰子选择重投；确认后仅选中的骰子会重新投掷。'
        : `点击骰子切换选中（最多 <b>${cap}</b> 颗）　·　可先点击重新投掷，再选择任意骰子。`;
      setAce({ top: aceTypeOk ? CARDS[A.id].ace : '', cnt: A.aceLeft,
               sub: aceTypeOk ? CARDS[A.id].aceText : '本回合不可用' });
      setHot('hotAce',   { disabled: rerollMode||!aceTypeOk||aceUsed||A.aceLeft<=0, title: aceUsed?'已使用':CARDS[A.id].ace });
      setHot('hotReroll',{ disabled: rerollMode ? false : rerolls<=0,
        title: rerollMode ? (pickedForReroll ? '确认投掷' : '取消重新投掷') : `重新投掷（剩余 ${rerolls}）` });
      setHot('hotOk',    { disabled: rerollMode||sel.length===0, title:'确认使用' });
    } else {
      $('hintTxt').textContent = `${A.name} 行动中…`;
      $('rerollTxt').textContent = '重新投掷';
      $('rerollCount').textContent = '';
      $('selectCount').textContent = '';
      setAce({ top:'', cnt:'', sub:'' });
      setHot('hotAce',{disabled:true}); setHot('hotReroll',{disabled:true}); setHot('hotOk',{disabled:true});
    }
  };
  const toggle = d => {
    if (rerollMode){
      d.reroll=!d.reroll;
      curEls.forEach((el,i)=>el.classList.toggle('reroll', !!dice[i].reroll));
      const rerollCount=dice.filter(x=>x.reroll).length;
      $('vsLine').textContent=`已选择 ${rerollCount} 颗骰子重新投掷　·　骰池 ${dice.length} 颗`;
      $('selectCount').textContent='';
      $('rerollTxt').textContent = rerollCount ? '确认投掷' : '取消重新投掷';
      setHot('hotReroll',{disabled:false, title:rerollCount ? '确认投掷' : '取消重新投掷'});
      return;
    }
    if (d.sel===false){
      const sel = dice.filter(x=>x.sel!==false);
      if (sel.length >= cap){
        const worst = sel.slice().sort((a,b)=>a.v-b.v)[0];
        if (worst) worst.sel = false;
      }
      d.sel = true;
    } else d.sel = false;
    // 原地改类名，不重建 DOM（重建会导致背景图重新解码，整排闪一下）
    curEls.forEach((el,i) => {
      el.classList.toggle('off', dice[i].sel === false);
      el.classList.toggle('sel', dice[i].sel !== false);
    });
    const selNow = dice.filter(x=>x.sel!==false);
    setBattleSums(sumSnapshot(S.lastAiSelected || S.lastAi), sumDice(selNow));
    setVal(sumDice(selNow), previewBonus(A,D,selNow), selNow.length===0);
    $('vsLine').textContent = `已选 ${selNow.length} / ${cap}　·　骰池 ${dice.length} 颗`;
    $('selectCount').textContent = `${selNow.length}/${cap}`;
    setHot('hotOk', { disabled: selNow.length===0 });
  };
  const rerollNow = () => {
    if (!rerollMode){
      if (rerolls<=0) return;
      dice.forEach(d=>{ d.reroll=false; d.sel=false; });
      rerollMode=true;
      refresh();
      return;
    }
    const targets=dice.filter(d=>d.reroll);
    if (!targets.length){
      rerollMode=false;
      dice.forEach(d=>{ d.reroll=false; });
      refresh();
      return;
    }
    rerolls--; rerollMode=false;
    targets.forEach(d => { d.v = R(d.f); d.reroll=false; });
    autoSelect(dice, cap);
    refresh({roll:true, rolledDice:targets});
  };
  const useAceNow = () => {
    if (aceUsed || A.aceLeft<=0) return;
    const oldDice=new Set(dice);
    applyAce(A.id, dice); A.aceLeft--; aceUsed=true;
    autoSelect(dice, cap);
    const addedDice=dice.filter(d=>!oldDice.has(d));
    refresh(addedDice.length ? {roll:true, rolledDice:addedDice} : undefined);
  };
  let done=null, resolveAsk=null;
  const waitAsk = new Promise(res=>{ resolveAsk=res; });
  const answer = () => { const f=resolveAsk; resolveAsk=null; if (f) f(); };
  $('hotReroll').onclick = rerollNow;
  $('hotAce').onclick = useAceNow;
  $('hotOk').onclick = () => {
    const selected=dice.filter(d=>d.sel!==false);
    $('selectCount').textContent = `${selected.length}/${cap}`;
    done = { dice: selected };
    answer();
  };

  refresh({roll:true});

  if (yourTurn){
    await waitAsk;
  } else {
    await wait(2700);
    if (aceTypeOk && A.aceLeft>0 && S.battleDiff!=='easy'){
      applyAce(A.id, dice); A.aceLeft--; autoSelect(dice, cap);
      refresh(); await wait(340);
    }
    while (rerolls>0 && aiWantReroll(A, D, dice, S.battleDiff, isAtk)){
      rerolls--;
      const sel = dice.filter(d=>d.sel!==false);
      const low = sel.filter(d=>d.v < (d.f+1)/2);
      const targets = (S.battleDiff!=='easy' && S.battleDiff!=='normal' && low.length) ? low : sel;
      targets.forEach(d => { d.v = R(d.f); });
      autoSelect(dice, cap);
      refresh(); await wait(480);
    }
    autoSelect(dice, cap);
    refresh(); await wait(280);
    done = { dice: dice.filter(d=>d.sel!==false) };
  }
  return done;
}

async function endTurn(A, D, atkRes, ctx){
  const dice = rollPool(buildPool(D, 'def', false));
  const shieldEl = D.human ? $('shieldBot') : $('shieldTop');
  shieldEl.classList.remove('brk','fade','on');
  void shieldEl.offsetWidth;
  shieldEl.classList.add('on');
  const defRes = await selectPhase(D, A, dice, 'def', {});
  // 最终展示区域固定按屏幕位置表达语义：上方永远是对方，下方永远是我方。
  // 行动方变化时，只交换骰子来源和角色信息，不交换两个区域。
  const opponentSide = A.human ? D : A;
  const playerSide = A.human ? A : D;
  const opponentDice = A.human ? defRes.dice : atkRes.dice;
  const playerDice = A.human ? atkRes.dice : defRes.dice;

  const paintFinal = (zone, side, tag, arr) => {
    zone.className = 'diceZone';
    zone.innerHTML = '';
    const lab = document.createElement('span'); lab.className = 'plabel';
    lab.textContent = `${tag} · ${side.name} ${arr.reduce((s,d)=>s+d.v,0)} 点数和`;
    zone.appendChild(lab);
    arr.forEach(d => zone.appendChild(dieMini(d.f, d.v)));
  };

  const playAttack = async (attackDice, isFollowup) => {
    if (isFollowup){
      shieldEl.classList.remove('brk','fade','on');
      void shieldEl.offsetWidth;
      shieldEl.classList.add('on');
    }
    fireBeam(A.human, A.id);
    await wait(3800);
    const res = resolve(A, D, attackDice, defRes.dice, { ...ctx, frostFollowup:isFollowup });

    paintFinal($('poolRow'),  opponentSide, '对方', opponentDice);
    paintFinal($('poolMine'), playerSide, '我方', playerDice);
    setBattleSums(sumDice(opponentDice), sumDice(playerDice));
    $('stageDice').innerHTML='';
    setVal(res.atkVal, 0, false);
    $('vsLine').textContent = res.ignoreDefense
      ? `${A.name} 攻 ${res.atkVal} · 无视 ${D.name} 防御（${res.rawDefVal}）`
      : res.dmg>0
      ? `${A.name} 攻 ${res.atkVal} − ${D.name} 防 ${res.defVal}`
      : `${A.name} 攻 ${res.atkVal} ≤ ${D.name} 防 ${res.defVal} · 完全挡下`;
    $('hintTxt').innerHTML = (isFollowup ? '<b>霜月追击 · 相同骰值再次攻击</b><br>' : '') + (res.ev.length ? res.ev.join('<br>') : '');
    setAce({top:'',cnt:'',sub:''});
    setHot('hotAce',{disabled:true}); setHot('hotReroll',{disabled:true}); setHot('hotOk',{disabled:true});
    paint();

    const atkFx  = A.human ? $('glowBot') : $('glowTop');
    const defFx  = D.human ? $('glowBot') : $('glowTop');
    atkFx.classList.add('lunge');
    setTimeout(()=>atkFx.classList.remove('lunge'), 900);
    if (res.dmg>0){
      shieldEl.classList.remove('on');
      shieldEl.classList.add('brk');
      defFx.classList.add('hit');
      $('board').classList.add('quake');
      setTimeout(()=>{ defFx.classList.remove('hit'); $('board').classList.remove('quake'); }, 540);
      $('flashNum').textContent='-' + res.dmg;
      $('flash').classList.add('on');
      setTimeout(()=>$('flash').classList.remove('on'), 1500);
      await wait(1400);
    } else {
      shieldEl.classList.remove('on');
      shieldEl.classList.add('fade');
      defFx.classList.add('blocked');
      setTimeout(()=>defFx.classList.remove('blocked'), 900);
      setTimeout(()=>shieldEl.classList.remove('fade'), 1400);
      await wait(1400);
    }
    await wait(1150);
    return res;
  };

  const first = await playAttack(atkRes.dice, false);
  let frostFollowupDone = false;
  if (first.hold && A.id==='trilune'){
    // 霜月追击复用第一次攻击和防御的相同点数，不再重投或重新选择。
    await playAttack(atkRes.dice, true);
    frostFollowupDone = true;
  }
  if (S.you.hp<=0 || S.ai.hp<=0){ finish(); return; }
  // 霜月两次攻击属于同一个回合；追击结束后必须把行动方交给防守方。
  // 其他仍使用 hold 的技能保留原有行为。
  if (!first.hold || frostFollowupDone) S.attacker=1-S.attacker;
  S.round++;
  await wait(220);
  beginTurn();
}

function finish(){
  S.over=true;
  const win = S.ai.hp<=0;
  $('overTitle').textContent = win ? '胜 利' : '败 北';
  $('overTitle').style.color = win ? 'var(--gold2)' : 'var(--red)';
  if (S.mode==='story'){
    if (win) S.stage++;
    $('overText').innerHTML = win
      ? `击败了 ${S.ai.name}，剩余 ${Math.max(0,S.you.hp)} 点生命。` +
        (S.stage>=STORY.length
          ? '<br><b style="color:var(--gold2)">全部 10 关通关！</b>'
          : `<br>下一关：${STORY[S.stage].title}`)
      : `被 ${S.ai.name} 击败。<br>本关可以重打。`;
    $('btnAgain').textContent = win ? '查看进度' : '重打本关';
  } else {
    $('overText').textContent = win
      ? `${S.you.name} 击败了 ${S.ai.name}，剩余 ${Math.max(0,S.you.hp)} 点生命。`
      : `${S.you.name} 被 ${S.ai.name} 击败。`;
    $('btnAgain').textContent = '再来一局';
  }
  setHot('hotAce',{disabled:true}); setHot('hotReroll',{disabled:true}); setHot('hotOk',{disabled:true});
  $('over').style.display='flex';
}
$('btnAgain').onclick = () => {
  $('over').style.display='none';
  if (S.mode==='story'){ renderStory(); show('s-story'); }
  else prepare(S.you.id);
};
$('btnBack').onclick = () => {
  $('over').style.display='none';
  show(S.mode==='story' ? 's-story' : 's-select');
};

/* 占位头像配色（元素主题色）。头像素材到位后，只要把 .av / .cxAva / .stAva

  hutao:'#c2453a', xiao:'#3aa6a0', zhongli:'#b08a3c', raiden:'#8b5fd0', bennett:'#d4743a',
  xingqiu:'#3a7fd0', venti:'#4fbf8f', ayaka:'#7fb8e8', nahida:'#6fbf5a', neuvil:'#3f6fd0',
  ganyu:'#8fd0e8', columb:'#a06fd0', trilune:'#d0d8ff',

function avaStyle(id){
  const c = AVA_COLOR[id] || '#4b5c86';
  return `background:radial-gradient(circle at 34% 26%,${c},${c}88 62%,#161d30 100%);`;
}

  box.insertAdjacentHTML('beforeend', `
    <div class="cxInfo">
      <h3>规则说明</h3>
      <ul>
        <li>每局双方各选 <b>1</b> 名角色，<b>不能选同一名</b>。</li>
        <li>开局投币定先后手，<b>后手方额外 +2 生命值</b>作为补偿。</li>
        <li>每回合由攻击方先投攻击骰，防御方再投防御骰，双方各自选骰。</li>
        <li>伤害 = <b>max(0, 攻击值 − 防御值)</b>。防御值 ≥ 攻击值即完全挡下，不掉血。</li>
        <li>任一方生命降到 <b>0</b> 即落败。平均一局约 14~15 回合。</li>
        <li>地脉异常（可选）会在开局给双方附加额外规则，见对局前的选项。</li>
      </ul>
    </div>
    <div class="cxInfo">
      <h3>骰子</h3>
      <ul>
        <li><b>骰池</b>：每名角色有固定骰池，当前 12 名角色都是 ${d4}${d4}${d6}${d6}（2 颗四面骰 + 2 颗六面骰）。</li>
        <li><b>可用上限</b>：攻击和防御各有上限（攻 2~3 / 防 2~3）。投出整池后，你只能从中<b>挑不超过上限的颗数</b>。</li>
        <li><b>和值</b>：选中骰子的点数之和，就是本次的攻击值 / 防御值，显示在中央的大数字上。</li>
        <li><b>重投</b>：每个阶段可重投 <b>1</b> 次。先点“重新投掷”，再任选需要重投的骰子并点“确认投掷”；未选骰子不会重投，也不会播放投掷动画。</li>

      <ul>

        <li>带地脉后平均回合数会变化：平涌 / 岩脉共振约 <b>16 回合</b>，风起地 / 深境回响约 <b>14.5 回合</b>，无地脉约 14 回合。</li>

function renderStory(){
  const bar=$('storyBar'); bar.innerHTML='';
  STORY.forEach((st,i)=>{
    const done = i < S.stage, cur = i === S.stage;
    const n=document.createElement('div');
    n.className='stNode'+(done?' done':'')+(cur?' cur':'');
    n.innerHTML=`<div class="stDot">${done?'✓':(i+1)}</div>
      <div class="stAva">${avaInner(st.opp)}</div>
      <div class="stNm">${(done||cur)?CARDS[st.opp].name:'???'}</div>`;
    bar.appendChild(n);
  });
  const st = STORY[S.stage];
  if (!st){
    $('storyTag').textContent = '全部通关';
    $('stWho').textContent = '已 通 关';
    $('stDsc').innerHTML = '你打穿了全部 10 关。<br>可以回自由对战继续练手，或重新挑战。';
    $('stLv').innerHTML = '';
    $('stGo').textContent = '重 新 挑 战';
  } else {
    $('storyTag').textContent = `第 ${S.stage+1} / ${STORY.length} 关`;
    $('stWho').textContent = `${CARDS[st.opp].name}　·　${CARDS[st.opp].role}`;
    $('stDsc').innerHTML = `<b style="color:var(--gold2)">${st.title}</b><br>${st.desc}`;
    $('stLv').innerHTML = `<span class="lv ${st.diff}">${LV_NAME[st.diff]}</span>`;
    $('stGo').textContent = '出 战';
  }
}

/* =====================================================================
   全屏 / 横屏
   - 手机竖屏：用 #lgate 挡住。这个游戏是 16:9 横屏棋盘，UI 又贴到 96%~100%
     宽度（确认键 87.88%、王牌骰文字到 100.26%），竖屏下等比缩放只剩一条缝、
     铺满又会拉扁，两种都玩不了，所以不给「继续竖屏」这种出口。
   - 横屏：右上角全屏按钮。进全屏后顺带尝试锁横屏 —— 只有 Android Chrome
     在全屏下支持 orientation.lock；iOS Safari 根本不支持元素全屏，按钮会隐藏。
   - 横竖屏判定用视口宽高，不用 matchMedia('(orientation: portrait)')：
     部分国产浏览器不更新它（主站 LandscapeGate 踩过）。
   ===================================================================== */
(function(){
  const fsBtn = $('fsBtn'), gate = $('lgate'), gateFs = $('lgFs');
  const root = document.documentElement;
  const reqFs  = root.requestFullscreen || root.webkitRequestFullscreen;
  const exitFs = document.exitFullscreen || document.webkitExitFullscreen;
  const fsOn   = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const fsOk   = !!reqFs && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

  if (fsOk){ fsBtn.classList.add('on'); gateFs.classList.add('on'); }

  function syncFs(){
    const on = fsOn();
    const label = on ? '退出全屏' : '全屏';
    fsBtn.title = label;
    fsBtn.setAttribute('aria-label', label);
    fsBtn.classList.toggle('isFs', on);
  }
  async function enterFs(){
    try { await reqFs.call(root); } catch (e) { return; }
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
    syncFs();
  }
  async function leaveFs(){
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    try { await exitFs.call(document); } catch (e) {}
    syncFs();
  }
  fsBtn.addEventListener('click', () => { fsOn() ? leaveFs() : enterFs(); });
  gateFs.addEventListener('click', enterFs);
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);
  syncFs();

  const mqCoarse = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
  function gateCheck(){
    const phone = (mqCoarse ? mqCoarse.matches : false)
      && Math.min(window.innerWidth, window.innerHeight) <= 600;
    const portrait = window.innerHeight >= window.innerWidth;
    gate.classList.toggle('on', phone && portrait);
  }
  window.addEventListener('resize', gateCheck);
  window.addEventListener('orientationchange', gateCheck);
  if (mqCoarse && mqCoarse.addEventListener) mqCoarse.addEventListener('change', gateCheck);
  gateCheck();
})();
</script>
